name: Android CI — Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Optional offline-speech engine. sherpa-onnx is not on Maven, so its AAR is fetched from the GitHub release.
      # If the download fails the build still succeeds: the app just reports the offline engine as "not installed".
      - name: Fetch sherpa-onnx AAR (optional)
        run: |
          mkdir -p app/libs
          if ls app/libs/*.aar >/dev/null 2>&1; then
            echo "AAR already in app/libs, skipping download"
          else
            VER=1.12.39
            curl -fL --retry 3 -o "app/libs/sherpa-onnx-$VER.aar" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VER/sherpa-onnx-$VER.aar" \
              || { echo "::warning::sherpa-onnx AAR download failed; offline speech engine stays disabled"; rm -f "app/libs/sherpa-onnx-$VER.aar"; }
          fi

      - name: Run lint checks
        run: ./gradlew lintDebug --continue || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssistAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssistAI-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # Unit tests run after the APKs are uploaded, so a failing test never costs you the APK.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
