name: Android CI — Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # RULE FOR EVERY STEP BELOW: nothing is swallowed and nothing is skipped because an earlier step failed.
      #  - no "|| true", no "continue-on-error": a failing step makes the whole job red
      #  - `if: ${{ !cancelled() }}` runs the step even after an earlier failure, so all failures show in ONE run
      #  - an upload step only waits for its own build step (nothing to upload if that build failed)

      # sherpa-onnx is not on Maven, so its AAR is fetched from the GitHub release.
      # If the download fails the job FAILS (before: only a warning, and offline speech silently stayed disabled).
      - name: Fetch sherpa-onnx AAR
        id: aar
        run: |
          mkdir -p app/libs
          if ls app/libs/*.aar >/dev/null 2>&1; then
            echo "AAR already in app/libs, skipping download"
          else
            VER=1.12.39
            if ! curl -fL --retry 3 -o "app/libs/sherpa-onnx-$VER.aar" \
                "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VER/sherpa-onnx-$VER.aar"; then
              rm -f "app/libs/sherpa-onnx-$VER.aar"
              echo "::error::sherpa-onnx AAR download failed - the offline speech engine would be silently disabled"
              exit 1
            fi
          fi

      - name: Build Debug APK
        id: build_debug
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDebug --continue

      - name: Build Release APK (unsigned)
        id: build_release
        if: ${{ !cancelled() }}
        run: ./gradlew assembleRelease --continue

      - name: Upload Debug APK
        if: ${{ !cancelled() && steps.build_debug.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssistAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        if: ${{ !cancelled() && steps.build_release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssistAI-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      # Unit tests and lint run after the APKs are uploaded, so a failing test or lint error never costs you the APK.
      - name: Run unit tests
        id: unit_tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --continue

      # lintDebug used to run first with "|| true" (and abortOnError = false): ~7 minutes of work whose result nobody saw.
      - name: Run lint checks
        id: lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --continue

      # Lists EVERY failed test and lint error (log + run summary + annotations). Also fails on 0 tests or any skipped test.
      - name: Failure summary (tests + lint)
        id: summary
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_report.py

      - name: Upload test + lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: error
          retention-days: 14
