plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.codeassist.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.codeassist.ai"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        // CI runs lintDebug as its own non-blocking step; lint findings must not stop assembleRelease.
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Bundled Latin OCR model for the opt-in, on-device Qwen screenshot-reading path.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // On-device GGUF inference (llama.cpp AAR, arm64-v8a, API 24+). Free API: loadModel / complete / releaseModel.
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'

    testImplementation 'junit:junit:4.13.2'
}
